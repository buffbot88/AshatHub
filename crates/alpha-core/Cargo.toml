[package]
name = "alpha-core"
version = "0.1.0"
edition = "2021"
description = "Ashat Alpha - intent router, queue & inference engine"

[dependencies]
alpha-common = { path = "../alpha-common" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
