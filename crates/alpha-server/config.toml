[queue]
max_requests = 32
# One always-on text worker is available; serialize inference and queue bursts safely.
max_concurrent = 9

# Vision pool (450M VL) — on-demand only, no minimum instances.
# Instances are spawned when an image arrives, shut down after idle timeout.
[pool]
min_instances = 0
port_base = 3001

# Liquid chat/tool backend. Set this to the deployed Liquid runtime.
[liquid]
endpoint = ""
model = "liquid"

# Vision on-demand settings.
# VL instances auto-shutdown after idle_timeout_secs to free RAM.
[vision]
idle_timeout_secs = 1800
on_demand = true

