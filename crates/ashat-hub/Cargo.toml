[package]
name = "ashat-hub"
version = "0.1.0"
edition = "2021"
description = "AshatHub Rust gateway and web backend"

[dependencies]
axum = "0.7"
bcrypt = "0.15"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio-rustls", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
