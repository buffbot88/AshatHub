<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paws &amp; Parcels — signing you in…</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --cream: #f7f0e3;
        --ink: #3a5a3a;
        --ink-soft: #6d7a4f;
        --leaf: #8fc98a;
        --warm: #d99a6c;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--cream);
        color: var(--ink);
        font-family: Georgia, "Iowan Old Style", serif;
        display: grid;
        place-items: center;
      }
      .card {
        padding: 24px 32px;
        border-radius: 14px;
        background: white;
        border: 2px solid var(--leaf);
        text-align: center;
        max-width: 340px;
      }
      .card h1 {
        margin: 0 0 6px 0;
        font-size: 18px;
        color: var(--ink);
      }
      .card p {
        margin: 0;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .card a {
        color: var(--warm);
      }
      .leaf {
        width: 32px;
        height: 32px;
        fill: var(--leaf);
        margin: 0 auto 8px;
      }
      .spinner {
        width: 22px;
        height: 22px;
        margin: 0 auto 10px;
        border: 3px solid rgba(143, 201, 138, 0.35);
        border-top-color: var(--leaf);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <svg class="leaf" viewBox="0 0 32 32" aria-hidden="true">
        <path
          d="M16 4 C 10 8, 8 12, 8 18 C 8 24, 12 28, 16 28 C 20 28, 24 24, 24 18 C 24 12, 22 8, 16 4 Z M 16 6 L 16 26"
          stroke="currentColor"
          stroke-width="1.5"
          fill="rgba(143, 201, 138, 0.4)"
        />
      </svg>
      <h1 id="title">Signing you in…</h1>
      <p id="detail">One moment while the post office checks your key.</p>
    </main>

    <script>
      (function () {
        "use strict";
        var params = new URLSearchParams(window.location.search);
        var code = params.get("code") || "";
        var state = params.get("state") || "";
        var storedState = "";
        var verifier = "";
        try {
          storedState = sessionStorage.getItem("paws.oidc.state") || "";
          verifier = sessionStorage.getItem("paws.oidc.verifier") || "";
        } catch (err) {
          // Storage blocked — report the error path below.
        }

        var title = document.getElementById("title");
        var detail = document.getElementById("detail");

        function fail(message, friendly) {
          document.querySelector(".spinner").style.display = "none";
          title.textContent = "Sign-in didn't complete";
          detail.innerHTML =
            friendly +
            ' <a href="./">Back to Paws &amp; Parcels</a>.';
          void message;
        }

        // state mismatch → possible CSRF attempt; never send the code.
        if (!code || !verifier || state !== storedState) {
          fail("state mismatch", "The sign-in link was stale or tampered with.");
          return;
        }

        // Load the game server URL from server_config.json (same file the
        // main app reads). Falls back to same-origin if the file is missing.
        fetch("./server_config.json", { cache: "no-store" })
          .then(function (res) { return res.ok ? res.json() : {}; })
          .catch(function () { return {}; })
          .then(function (cfg) {
            var API_BASE = (cfg && typeof cfg.gameServerUrl === "string")
              ? cfg.gameServerUrl
              : "";

            return fetch(API_BASE + "/api/auth/oidc/callback", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "omit",
              body: JSON.stringify({ code: code, state: state, code_verifier: verifier }),
            });
          })
          .then(function (res) {
            return res.json().then(function (body) {
              return { ok: res.ok, status: res.status, body: body };
            });
          })
          .then(function (result) {
            if (!result.ok || !result.body || typeof result.body.token !== "string") {
              fail(
                result.body && result.body.message ? result.body.message : "server error",
                "The post office couldn't finish signing you in.",
              );
              return;
            }
            // Store the JWT + account, then drop the PKCE secrets.
            try {
              localStorage.setItem("paws.auth.token", result.body.token);
              localStorage.setItem(
                "paws.auth.account",
                JSON.stringify(result.body.account),
              );
              localStorage.setItem(
                "paws.auth.characters",
                JSON.stringify(result.body.characters),
              );
              sessionStorage.removeItem("paws.oidc.state");
              sessionStorage.removeItem("paws.oidc.verifier");
            } catch (err) {
              // Private mode — token lives in memory for this page only.
            }
            title.textContent = "Welcome back, courier!";
            detail.textContent = "Handing you your parcel bag…";
            // Redirect back to the game (relative path handles subpath deploys).
            // bootAfterAuth validates the stored JWT and boots the game or
            // shows the maintenance screen.
            window.location.replace("./");
          })
          .catch(function () {
            fail("network error", "The post office is unreachable right now.");
          });
      })();
    </script>
  </body>
</html>
