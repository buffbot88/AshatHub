# Paws & Parcels - HTTP to HTTPS redirect
<VirtualHost *:80>
    ServerName pawsandparcels.agpstudios.org
    Redirect permanent / https://pawsandparcels.agpstudios.org/
</VirtualHost>

# Paws & Parcels - HTTPS
<VirtualHost *:443>
    ServerName pawsandparcels.agpstudios.org
    DocumentRoot "/home/opc/projects/Paws&Parcels"
    DirectoryIndex index.html

    # SSL
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pawsandparcels.agpstudios.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pawsandparcels.agpstudios.org/privkey.pem

    <Directory "/home/opc/projects/Paws&Parcels">
        AllowOverride None
        Require all granted
        Options -Indexes +FollowSymLinks

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/\.well-known/
        RewriteRule ^ index.html [L]
    </Directory>

    ErrorLog /var/log/httpd/pawsandparcels-error.log
    CustomLog /var/log/httpd/pawsandparcels-access.log combined
</VirtualHost>
